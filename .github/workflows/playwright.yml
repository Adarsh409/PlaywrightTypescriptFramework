name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    env:
      BASE_URL: http://localhost:4200/
      API_BASE_URL: http://localhost:8091
    steps:
    - uses: actions/checkout@v4
    - name: Checkout Practice Software Testing app
      uses: actions/checkout@v4
      with:
        repository: testsmith-io/practice-software-testing
        ref: main
        path: practice-software-testing
    - name: Start application containers
      working-directory: practice-software-testing
      env:
        SPRINT: sprint5
        DISABLE_LOGGING: "true"
      run: docker compose -f docker-compose.yml up -d --force-recreate
    - name: Sleep for 30 seconds (wait for containers)
      run: sleep 30s
    - name: Install Composer dependencies
      working-directory: practice-software-testing
      run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi
    - name: Wait for database to be ready
      working-directory: practice-software-testing
      run: |
        echo "Waiting for MariaDB..."
        for i in $(seq 1 30); do
          if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
            echo "MariaDB is ready!"
            break
          fi
          echo "Attempt $i/30 - not ready yet, waiting 2s..."
          sleep 2
        done
    - name: Create & Seed database
      working-directory: practice-software-testing
      run: docker compose exec -T laravel-api php artisan migrate:refresh --seed
    - name: Wait for API to be ready
      run: curl -v --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8091/status
    - name: Wait for Angular UI to be ready
      working-directory: practice-software-testing
      run: |
        echo "Waiting for Angular UI on port 4200..."
        for i in $(seq 1 60); do
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200"; then
            echo "Angular UI is ready!"
            exit 0
          fi
          echo "Attempt $i/60 - not ready yet, waiting 5s..."
          sleep 5
        done
        echo "Angular UI failed to start within 5 minutes"
        docker compose logs angular-ui
        exit 1
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test tests/cart.spec.ts
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
